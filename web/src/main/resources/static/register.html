<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-4">

            <div class="card shadow">
                <div class="card-body">
                    <h4 class="card-title text-center mb-4">Создание аккаунта</h4>

                    <form id="register-form">

                        <div class="mb-3">
                            <label for="username" class="form-label">Логин</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">Зарегистрироваться</button>
                        </div>

                        <div class="d-grid mt-3">
                            <button type="button"
                                    class="btn btn-outline-secondary"
                                    onclick="window.location.href='/login.html'">
                                Уже есть аккаунт
                            </button>
                        </div>

                        <div id="msg" class="text-center mt-3 fw-bold"></div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>


<script>
    document.getElementById("register-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        const res = await fetch("http://localhost:8081/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
           body: JSON.stringify({
        username: username,
        rawPassword: password
    })
        });

        const msg = document.getElementById("msg");

        if (res.ok) {
            msg.textContent = "Регистрация успешна!";
            msg.className = "text-success fw-bold text-center";

            setTimeout(() => window.location.href = "/login.html", 1400);
        } else {
            const text = await res.text();
            msg.textContent = text || "Ошибка регистрации";
            msg.className = "text-danger fw-bold text-center";
        }
    });
</script>

</body>
</html>
