<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-4">

            <div class="card shadow">
                <div class="card-body">

                    <h4 class="text-center mb-4">Вход в систему</h4>

                    <form id="login-form">

                        <div class="mb-3">
                            <label class="form-label" for="username">Логин</label>
                            <input id="username" type="text" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">Пароль</label>
                            <input id="password" type="password" class="form-control" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Войти</button>
                        </div>

                        <div class="d-grid mt-3">
                            <button type="button"
                                    class="btn btn-secondary"
                                    onclick="window.location.href='/register.html'">
                                Регистрация
                            </button>
                        </div>

                        <div id="error-msg" class="text-danger text-center mt-3" style="display:none;"></div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', async () => {
         const res = await fetch('http://localhost:8081/api/auth/me', {
             credentials: 'include'
         });
         if (res.ok) {
             // уже авторизован — редиректим
             window.location.href = '/index.html';
         }
     });

     document.getElementById('login-form').addEventListener('submit', async function (e) {
         e.preventDefault();

         const username = document.getElementById('username').value;
         const rawPassword = document.getElementById('password').value;

 const response = await fetch('http://localhost:8081/login', {
            method: 'POST',
            credentials: 'include',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            })
        });

        if (response.ok) {
            window.location.href = '/index.html'; // перенаправление после входа
        } else {
            document.getElementById('error-msg').style.display = 'block';
            document.getElementById('error-msg').textContent = 'Неверный логин или пароль';
        }
     });
</script>

</body>
</html>
