<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Объединённое облачное хранилище</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/js/auth-check.js" defer></script>
    <style>
        body {
          background-color: #f8f9fa;
        }
        .table-hover tbody tr:hover {
          background-color: #e9ecef;
        }
        .actions button {
          margin-right: 5px;
        }
    </style>
</head>
<body>
<!-- Навигация -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Объединённое хранилище</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="index.html">Файлы</a></li>
                <li class="nav-item"><a class="nav-link" href="notifications.html">Уведомления</a></li>
                <li class="nav-item"><a class="nav-link" href="profile.html">Профиль</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between mb-3">
        <div>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#uploadModal">Загрузить файл</button>
            <button class="btn btn-outline-primary" id="downloadSelected">Выгрузить выбранные</button>
            <button class="btn btn-outline-secondary" id="selectAllBtn">Выбрать все</button>
        </div>
    </div>

    <!-- Таблица файлов -->
    <table class="table table-bordered table-hover align-middle">
        <thead class="table-primary">
        <tr>
            <th><input type="checkbox" id="selectAll"></th>
            <th>Название файла</th>
            <th>Размер</th>
            <th>Дата загрузки</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody id="fileTable">
        <tr>
            <td><input type="checkbox" class="file-checkbox"></td>
            <td>document.pdf</td>
            <td>1.2 MB</td>
            <td>29.10.2025</td>
            <td class="actions">
                <button class="btn btn-sm btn-primary">Выгрузить</button>
                <button class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#editModal">Редактировать</button>
                <button class="btn btn-sm btn-danger" data-bs-toggle="modal" data-bs-target="#deleteModal">Удалить</button>
            </td>
        </tr>
        <tr>
            <td><input type="checkbox" class="file-checkbox"></td>
            <td>photo.jpg</td>
            <td>850 KB</td>
            <td>28.10.2025</td>
            <td class="actions">
                <button class="btn btn-sm btn-primary">Выгрузить</button>
                <button class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#editModal">Редактировать</button>
                <button class="btn btn-sm btn-danger" data-bs-toggle="modal" data-bs-target="#deleteModal">Удалить</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Модальные окна -->

<!-- Загрузка файла -->
<div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">Загрузка файла</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="file" class="form-control">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button class="btn btn-success">Загрузить</button>
            </div>
        </div>
    </div>
</div>

<!-- Редактирование файла -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-warning">
                <h5 class="modal-title">Редактирование файла</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label class="form-label">Новое название файла:</label>
                <input type="text" class="form-control" value="document.pdf">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button class="btn btn-warning">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<!-- Удаление файла -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">Удаление файла</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Вы уверены, что хотите удалить этот файл?
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button class="btn btn-danger">Удалить</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script >
    // Выбор всех файлов
    const selectAll = document.getElementById('selectAll');
    const checkboxes = document.querySelectorAll('.file-checkbox');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const downloadSelected = document.getElementById('downloadSelected');

    selectAll.addEventListener('change', () => {
      checkboxes.forEach(cb => cb.checked = selectAll.checked);
    });

    selectAllBtn.addEventListener('click', () => {
      const allSelected = [...checkboxes].every(cb => cb.checked);
      checkboxes.forEach(cb => cb.checked = !allSelected);
      selectAll.checked = !allSelected;
      selectAllBtn.textContent = allSelected ? 'Выбрать все' : 'Снять выбор';
    });

    downloadSelected.addEventListener('click', () => {
      const selected = [...checkboxes].filter(cb => cb.checked).length;
      if (selected === 0) {
        alert('Выберите хотя бы один файл для выгрузки.');
      } else {
        alert(`Выгружено файлов: ${selected}`);
      }
    });
</script>
</body>
</html>
