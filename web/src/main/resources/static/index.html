<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Объединённое облачное хранилище</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/js/auth-check.js" defer></script>

    <style>
        body { background-color: #f8f9fa; }
        .folder-item { cursor: pointer; font-weight: bold; }
        .table-hover tbody tr:hover { background-color: #eef1f3; }
    </style>
</head>
<body>

<!-- Навигация -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">S3 Cloud Storage</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="index.html">Файлы</a></li>
                <li class="nav-item">
                    <button id="logoutBtn" class="btn btn-danger btn-sm ms-3">Выход</button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-3">

    <!-- Верхняя панель -->
    <div class="d-flex justify-content-between mb-3">
        <div>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#uploadModal">Загрузить файл</button>
            <button class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#folderModal">Создать папку</button>
        </div>
        <div id="currentPath" class="fw-bold">/</div>
    </div>

    <!-- Список папок -->
    <ul id="folderList" class="list-group mb-3"></ul>

    <!-- Таблица файлов -->
    <table class="table table-bordered table-hover align-middle">
        <thead class="table-primary">
        <tr>
            <th>Название файла</th>
            <th>Размер</th>
            <th>Тип</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody id="fileTable"></tbody>
    </table>
</div>

<!-- Модальное окно: загрузка -->
<div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">Загрузка файла</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="file" id="fileInput" class="form-control">
            </div>
            <div class="modal-footer">
                <button class="btn btn-success" id="uploadBtn">Загрузить</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно: создание папки -->
<div class="modal fade" id="folderModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-secondary text-white">
                <h5 class="modal-title">Создать папку</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input id="folderName" class="form-control" placeholder="Название папки">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="createFolderBtn">Создать</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let currentFolderId = null;

    document.getElementById("logoutBtn").onclick = async () => {
        await fetch("http://localhost:8081/logout", { method: "POST", credentials: 'include' });
        window.location.href = "/login.html";
    };

    // -----------------------------
    // Папки
    // -----------------------------
    async function loadFolders() {
        const res = await fetch("http://localhost:8081/api/folders/root", { credentials: 'include' });
        const folders = await res.json();
        const list = document.getElementById("folderList");
        list.innerHTML = "";

        folders.forEach(f => {
            const li = document.createElement("li");
            li.className = "list-group-item folder-item d-flex justify-content-between align-items-center";

            const nameSpan = document.createElement("span");
            nameSpan.textContent = "📁 " + f.name;
            nameSpan.onclick = () => openFolder(f.id, f.name);

            const btnGroup = document.createElement("div");

            // Переименовать
            const renameBtn = document.createElement("button");
            renameBtn.className = "btn btn-warning btn-sm ms-1";
            renameBtn.textContent = "✎";
            renameBtn.onclick = async (e) => {
                e.stopPropagation();
                let newName = prompt("Новое имя папки:", f.name);
                if (!newName) return;
                await fetch(`http://localhost:8081/api/folders/${f.id}/rename`, {
                    method: "PUT",
                    credentials: "include",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: newName })
                });
                loadFolders();
            };

            // Удалить
            const deleteBtn = document.createElement("button");
            deleteBtn.className = "btn btn-danger btn-sm ms-1";
            deleteBtn.textContent = "✖";
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                deleteFolder(f.id);
            };

            btnGroup.appendChild(renameBtn);
            btnGroup.appendChild(deleteBtn);

            li.appendChild(nameSpan);
            li.appendChild(btnGroup);
            list.appendChild(li);
        });
    }

    async function deleteFolder(id) {
        await fetch(`http://localhost:8081/api/folders/${id}`, { method: "DELETE", credentials: "include" });
        loadFolders();
    }

    async function openFolder(id, name) {
        currentFolderId = id;
        document.getElementById("currentPath").textContent = "/" + name;
        loadFiles();
    }

    // -----------------------------
    // Файлы
    // -----------------------------
    async function loadFiles() {
        const res = await fetch(`http://localhost:8081/api/files/folder/${currentFolderId ?? ""}`, { credentials: 'include' });
        const files = await res.json();
        const table = document.getElementById("fileTable");
        table.innerHTML = "";

        files.forEach(file => {
            const tr = document.createElement("tr");

            const nameTd = document.createElement("td");
            nameTd.textContent = file.fileName;

            const sizeTd = document.createElement("td");
            sizeTd.textContent = (file.size / 1024).toFixed(1) + " KB";

            const typeTd = document.createElement("td");
            typeTd.textContent = file.contentType;

            const actionsTd = document.createElement("td");

            // Скачать
            const downloadBtn = document.createElement("button");
            downloadBtn.className = "btn btn-primary btn-sm";
            downloadBtn.textContent = "⬇";
            downloadBtn.onclick = () => downloadFile(file.id);

            // Переименовать
            const renameBtn = document.createElement("button");
            renameBtn.className = "btn btn-warning btn-sm ms-1";
            renameBtn.textContent = "✎";
            renameBtn.onclick = async () => {
                let newName = prompt("Новое имя файла:", file.fileName);
                if (!newName) return;
                await fetch(`http://localhost:8081/api/files/${file.id}/rename`, {
                    method: "PUT",
                    credentials: "include",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: newName })
                });
                loadFiles();
            };

            // Удалить
            const deleteBtn = document.createElement("button");
            deleteBtn.className = "btn btn-danger btn-sm ms-1";
            deleteBtn.textContent = "✖";
            deleteBtn.onclick = () => deleteFile(file.id);

            actionsTd.appendChild(downloadBtn);
            actionsTd.appendChild(renameBtn);
            actionsTd.appendChild(deleteBtn);

            tr.appendChild(nameTd);
            tr.appendChild(sizeTd);
            tr.appendChild(typeTd);
            tr.appendChild(actionsTd);
            table.appendChild(tr);
        });
    }

    async function downloadFile(id) {
        window.location.href = `http://localhost:8081/api/files/${id}/download`;
    }

    async function deleteFile(id) {
        await fetch(`http://localhost:8081/api/files/${id}`, { method: "DELETE", credentials: "include" });
        loadFiles();
    }

    // -----------------------------
    // Модалки
    // -----------------------------
    document.getElementById("uploadBtn").onclick = async () => {
        let file = document.getElementById("fileInput").files[0];
        if (!file) return;

        let formData = new FormData();
        formData.append("file", file);
        formData.append("folderId", currentFolderId);

        await fetch("http://localhost:8081/api/files/upload", {
            method: "POST",
            credentials: "include",
            body: formData
        });

        loadFiles();

        // Закрыть модалку
        const uploadModal = bootstrap.Modal.getInstance(document.getElementById('uploadModal'));
        uploadModal.hide();
    };

    document.getElementById("createFolderBtn").onclick = async () => {
        let name = document.getElementById("folderName").value;
        if (!name) return;

        await fetch("http://localhost:8081/api/folders/create", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: name, parentId: currentFolderId })
        });

        loadFolders();

        // Закрыть модалку
        const folderModal = bootstrap.Modal.getInstance(document.getElementById('folderModal'));
        folderModal.hide();
    };

    // -----------------------------
    // Инициализация
    // -----------------------------
    loadFolders();
    loadFiles();
</script>

</body>
</html>
