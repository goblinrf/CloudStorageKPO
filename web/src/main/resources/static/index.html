<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Объединённое облачное хранилище</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/js/auth-check.js" defer></script>
    <style>
        body { background-color: #f8f9fa; }
        .folder-item { cursor: pointer; font-weight: bold; }
        .table-hover tbody tr:hover { background-color: #eef1f3; }
        .breadcrumb-item { cursor: pointer; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Cloud Storage</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="index.html">Файлы</a></li>
                <li class="nav-item">
                    <button id="logoutBtn" class="btn btn-danger btn-sm ms-3">Выход</button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-3">
    <div class="d-flex justify-content-between mb-3">
        <div>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#uploadModal">Загрузить файл</button>
            <button class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#folderModal">Создать папку</button>
        </div>
        <nav aria-label="breadcrumb">
            <ol id="breadcrumb" class="breadcrumb mb-0 fw-bold">
                <li class="breadcrumb-item" onclick="goToRoot()">/</li>
            </ol>
        </nav>
    </div>

    <ul id="folderList" class="list-group mb-3"></ul>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-primary">
        <tr>
            <th>Название файла</th>
            <th>Размер</th>
            <th>Тип</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody id="fileTable"></tbody>
    </table>
</div>

<!-- Модальные окна -->
<div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">Загрузка файла</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="file" id="fileInput" class="form-control">
            </div>
            <div class="modal-footer">
                <button class="btn btn-success" id="uploadBtn">Загрузить</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="folderModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-secondary text-white">
                <h5 class="modal-title">Создать папку</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input id="folderName" class="form-control" placeholder="Название папки">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="createFolderBtn">Создать</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const BASE_URL = "http://localhost:8081";

    let folderStack = [{id: null, name: "/"}]; // Стек папок для навигации

    document.getElementById("logoutBtn").onclick = async () => {
        await fetch(`${BASE_URL}/logout`, { method: "POST", credentials: 'include' });
        window.location.href = "/login.html";
    };

    // -----------------------------
    // Breadcrumb
    // -----------------------------
    function renderBreadcrumb() {
        const breadcrumb = document.getElementById("breadcrumb");
        breadcrumb.innerHTML = "";
        folderStack.forEach((f, i) => {
            const li = document.createElement("li");
            li.className = "breadcrumb-item" + (i === folderStack.length - 1 ? " active" : "");
            li.textContent = f.name;
            if (i < folderStack.length - 1) li.onclick = () => goToFolderIndex(i);
            breadcrumb.appendChild(li);
        });
    }

    function goToFolderIndex(index) {
        folderStack = folderStack.slice(0, index + 1);
        loadCurrentFolder();
    }

    function goToRoot() {
        folderStack = [{id: null, name: "/"}];
        loadCurrentFolder();
    }

    // -----------------------------
    // Папки
    // -----------------------------
    async function loadFolders(folderId) {
        const url = folderId ? `${BASE_URL}/api/folders/${folderId}/sub` : `${BASE_URL}/api/folders/root`;
        const res = await fetch(url, { credentials: 'include' });
        const folders = await res.json();
        const list = document.getElementById("folderList");
        list.innerHTML = "";
        if (!Array.isArray(folders)) return;

        folders.forEach(f => {
            const li = document.createElement("li");
            li.className = "list-group-item folder-item d-flex justify-content-between align-items-center";

            const nameSpan = document.createElement("span");
            nameSpan.textContent = "📁 " + f.name;
            nameSpan.onclick = () => openFolder(f.id, f.name);

            const btnGroup = document.createElement("div");

            const renameBtn = document.createElement("button");
            renameBtn.className = "btn btn-warning btn-sm ms-1";
            renameBtn.textContent = "✎";
            renameBtn.onclick = async (e) => {
                e.stopPropagation();
                let newName = prompt("Новое имя папки:", f.name);
                if (!newName) return;
                await fetch(`${BASE_URL}/api/folders/${f.id}/rename`, {
                    method: "PUT",
                    credentials: "include",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({name: newName})
                });
                loadFolders(folderStack[folderStack.length-1].id);
            };

            const deleteBtn = document.createElement("button");
            deleteBtn.className = "btn btn-danger btn-sm ms-1";
            deleteBtn.textContent = "✖";
            deleteBtn.onclick = async (e) => {
                e.stopPropagation();
                if (!confirm(`Удалить папку "${f.name}"?`)) return;
                await fetch(`${BASE_URL}/api/folders/${f.id}`, {method: "DELETE", credentials: "include"});
                loadFolders(folderStack[folderStack.length-1].id);
            };

            btnGroup.appendChild(renameBtn);
            btnGroup.appendChild(deleteBtn);

            li.appendChild(nameSpan);
            li.appendChild(btnGroup);
            list.appendChild(li);
        });
    }

    async function openFolder(id, name) {
        folderStack.push({id, name});
        loadCurrentFolder();
    }

    async function loadCurrentFolder() {
        renderBreadcrumb();
        const currentFolderId = folderStack[folderStack.length-1].id;
        await loadFolders(currentFolderId);
        await loadFiles(currentFolderId);
    }

    // -----------------------------
    // Файлы
    // -----------------------------
    async function loadFiles(folderId) {
        const folderSegment = folderId ? `/${folderId}` : "";
        const res = await fetch(`${BASE_URL}/api/files/folder${folderSegment}`, { credentials: 'include' });
        const files = await res.json();
        const table = document.getElementById("fileTable");
        table.innerHTML = "";
        if (!Array.isArray(files)) return;

        files.forEach(file => {
            const tr = document.createElement("tr");

            const nameTd = document.createElement("td"); nameTd.textContent = file.fileName;
            const sizeTd = document.createElement("td"); sizeTd.textContent = (file.size/1024).toFixed(1) + " KB";
            const typeTd = document.createElement("td"); typeTd.textContent = file.contentType;
            const actionsTd = document.createElement("td");

            const downloadBtn = document.createElement("button"); downloadBtn.className="btn btn-primary btn-sm"; downloadBtn.textContent="⬇"; downloadBtn.onclick=()=>downloadFile(file.id);
            const renameBtn = document.createElement("button"); renameBtn.className="btn btn-warning btn-sm ms-1"; renameBtn.textContent="✎"; renameBtn.onclick=async ()=>{
                let newName = prompt("Новое имя файла:", file.fileName);
                if(!newName) return;
                await fetch(`${BASE_URL}/api/files/${file.id}/rename`, {
                    method:"PUT", credentials:"include", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name:newName})
                });
                loadFiles(folderId);
            };
            const deleteBtn = document.createElement("button"); deleteBtn.className="btn btn-danger btn-sm ms-1"; deleteBtn.textContent="✖"; deleteBtn.onclick=async ()=>{
                await fetch(`${BASE_URL}/api/files/${file.id}`, {method:"DELETE", credentials:"include"});
                loadFiles(folderId);
            };

            actionsTd.appendChild(downloadBtn); actionsTd.appendChild(renameBtn); actionsTd.appendChild(deleteBtn);
            tr.appendChild(nameTd); tr.appendChild(sizeTd); tr.appendChild(typeTd); tr.appendChild(actionsTd);
            table.appendChild(tr);
        });
    }

    function downloadFile(id){ window.location.href = `${BASE_URL}/api/files/${id}/download`; }

    // -----------------------------
    // Модалки
    // -----------------------------
    document.getElementById("uploadBtn").onclick = async ()=>{
        let file = document.getElementById("fileInput").files[0];
        if(!file) return;
        const currentFolderId = folderStack[folderStack.length-1].id;
        let formData = new FormData(); formData.append("file", file); formData.append("folderId", currentFolderId ?? "");
        await fetch(`${BASE_URL}/api/files/upload`, {method:"POST", credentials:"include", body:formData});
        await loadFiles(currentFolderId);
        bootstrap.Modal.getInstance(document.getElementById('uploadModal')).hide();
    };

    document.getElementById("createFolderBtn").onclick = async ()=>{
        let name = document.getElementById("folderName").value; if(!name) return;
        const currentFolderId = folderStack[folderStack.length-1].id;
        await fetch(`${BASE_URL}/api/folders/create`, {
            method:"POST", credentials:"include", headers:{"Content-Type":"application/json"},
            body:JSON.stringify({name:name, parentId:currentFolderId ?? null})
        });
        await loadFolders(currentFolderId);
        bootstrap.Modal.getInstance(document.getElementById('folderModal')).hide();
    };

    // -----------------------------
    // Инициализация
    // -----------------------------
    loadCurrentFolder();
</script>

</body>
</html>
