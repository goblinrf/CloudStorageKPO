<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Объединённое хранилище</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/js/auth-check.js" defer></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">Объединённое хранилище</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="index.html">Файлы</a></li>
            <li class="nav-item"><a class="nav-link active" href="notifications.html">Уведомления</a></li>
            <li class="nav-item"><a class="nav-link active" href="profile.html">Профиль</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
    <h4>Профиль пользователя</h4>
    <form class="mt-3" style="max-width: 500px;">
        <div class="mb-3">
            <label class="form-label">Имя пользователя</label>
            <input type="text" class="form-control" value="Пользователь" required>
        </div>
        <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-control" value="user@example.com" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Новый пароль</label>
            <input type="password" class="form-control" placeholder="Введите новый пароль">
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3">Сохранить изменения</button>
    </form>
</div>
</body>
</html>
